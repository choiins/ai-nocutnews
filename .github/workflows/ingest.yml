name: RSS ingest

on:
  schedule:
    # KST 06:00~24:00 1시간마다(UTC 21~14시), KST 00~05시 휴식.
    # 정시(:00)는 GitHub Actions 스케줄러 혼잡 구간이라 :17로 비켜 둔다 — 지연을 줄이라는 공식 권고.
    - cron: '17 0-14,21-23 * * *'
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write   # keepalive 단계에서 워크플로 재활성화
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json
      - name: Install deps
        working-directory: scripts
        run: npm ci
      - name: Run ingest
        working-directory: scripts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
        run: node ingest.mjs
      # 저장소에 60일간 커밋이 없으면 GitHub가 예약 실행을 끈다(disabled_inactivity, 2026-10 실제로 7일 중단).
      # 실행될 때마다 스스로 enable API를 호출해 무활동 타이머를 리셋한다. ingest가 실패해도 돈다.
      - name: Keepalive
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/ingest.yml/enable
